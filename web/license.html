<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Locked</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#1e1e2e',
                        surface: '#313244',
                        surface2: '#181825',
                        text: '#cdd6f4',
                        subtext: '#a6adc8',
                        primary: '#89b4fa',
                        danger: '#f38ba8',
                        success: '#a6e3a1',
                        warning: '#f9e2af'
                    }
                }
            }
        }
    </script>
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body class="bg-bg text-text font-sans h-screen flex flex-col items-center justify-center">

    <div class="bg-surface2 border border-surface p-8 rounded-xl shadow-2xl max-w-lg w-full text-center">
        <svg class="w-16 h-16 mx-auto mb-4 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z"></path></svg>

        <h1 class="text-3xl font-bold mb-2">Software Locked</h1>
        <p class="text-subtext mb-6">You need a valid license to use this software.</p>

        <div class="bg-bg p-4 rounded-lg mb-6 border border-surface text-left relative group">
            <span class="text-xs font-bold text-subtext uppercase tracking-wider block mb-1">Your Hardware ID (HWID):</span>
            <span id="hwid-label" class="font-mono text-sm break-all select-all">Loading...</span>
        </div>

        <div class="flex space-x-4 justify-center">
            <button onclick="copyHwid()" class="bg-surface hover:bg-subtext hover:text-bg text-text px-6 py-3 rounded-lg font-semibold transition flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Copy HWID
            </button>
            <button onclick="buyNow()" class="bg-[#25D366] hover:bg-[#128C7E] text-white px-6 py-3 rounded-lg font-bold transition flex items-center shadow-lg shadow-[#25D366]/20">
                <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                Buy Now
            </button>
        </div>
    </div>

    <script>
        async function loadHwid() {
            const hwid = await eel.get_hwid()();
            document.getElementById('hwid-label').innerText = hwid;
        }

        function copyHwid() {
            const text = document.getElementById('hwid-label').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("HWID copied to clipboard.");
            });
        }

        async function buyNow() {
            await eel.open_buy_link()();
        }

        window.onload = loadHwid;
    </script>
</body>
</html>
